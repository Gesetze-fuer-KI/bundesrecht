name: Sync

# Every night: mirror gesetze-im-internet.de into this repository and commit what changed.
# The sync code lives in Gesetze-fuer-KI/gesetze-fuer-ki (app/sync.py); this repository holds only data.
#
# GitHub's own runners often cannot reach gesetze-im-internet.de, so the sync runs on our self-hosted runner
# (notefeed-ansible, role github_runner). If a night's run fails anyway, it is retried every two hours until 13:17 UTC;
# a scheduled run that finds a successful run of the same (UTC) day stops at the check and asks nothing.
#
# healthchecks.io (secret HEALTHCHECKS_URL) gets a ping after each successful sync; its check expects one a day and
# alerts when none has arrived by the afternoon, so a single failed attempt does not page anyone.
# The failure that killed bundestag/gesetze was a sync that silently stopped.

on:
  schedule:
    - cron: "17 3 * * *"  # 03:17 UTC, after gesetze-im-internet.de's nightly build
    - cron: "17 5,7,9,11,13 * * *"  # retries; they stop at the check once the day has a successful run
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      done: ${{ steps.today.outputs.done }}
    steps:
      - name: Has today already a successful sync?
        id: today
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          done=false
          if [ "$GITHUB_EVENT_NAME" = schedule ]; then
            n=$(gh run list -R "$GITHUB_REPOSITORY" --workflow sync.yml --status success \
              --created ">=$(date -u +%F)" --json databaseId -q length)
            [ "$n" -gt 0 ] && done=true
          fi
          echo "done=$done" >> "$GITHUB_OUTPUT"
          echo "Already synced today: $done"

  sync:
    needs: check
    if: needs.check.outputs.done != 'true'
    # Our own runner on notefeed-1 (github-runner): GitHub's runners often cannot reach gesetze-im-internet.de.
    runs-on: [self-hosted, gesetze]
    timeout-minutes: 60
    env:
      HEALTHCHECKS_URL: ${{ secrets.HEALTHCHECKS_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: data

      - uses: actions/checkout@v4
        with:
          repository: Gesetze-fuer-KI/gesetze-fuer-ki
          path: tool

      - uses: astral-sh/setup-uv@v6

      - name: Sync
        working-directory: tool/app
        run: uv run --frozen --no-dev python sync.py --out "$GITHUB_WORKSPACE/data"

      - name: Commit
        working-directory: data
        run: |
          git config user.name "gesetze-fuer-ki sync"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet -- . ':!.sync'; then
            echo "No law changed."
            exit 0
          fi
          git commit -q -F .sync/commit-message.txt
          git push

      - name: Report to healthchecks.io
        if: env.HEALTHCHECKS_URL != ''
        run: curl -fsS -m 10 --retry 3 "$HEALTHCHECKS_URL" > /dev/null || true
