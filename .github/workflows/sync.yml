name: Sync

# Every night: mirror gesetze-im-internet.de into this repository and commit what changed.
# The sync code lives in Gesetze-fuer-KI/gesetze-fuer-ki (app/sync.py); this repository holds only data.
#
# A failed run sends GitHub's usual failure email. If the secret KUMA_PUSH_URL is set, a
# successful run also pings that Uptime Kuma push monitor, which alerts when no ping arrives
# for a day: the failure that killed bundestag/gesetze was a sync that silently stopped.
#
# healthchecks.io (secret HEALTHCHECKS_URL, one check per repository) gets /start when the run begins and, at the
# end, a success ping or /fail; it alerts on a failed run and when a night's run does not happen at all.

on:
  schedule:
    - cron: "17 3 * * *"  # 03:17 UTC, after gesetze-im-internet.de's nightly build
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      KUMA_PUSH_URL: ${{ secrets.KUMA_PUSH_URL }}
      HEALTHCHECKS_URL: ${{ secrets.HEALTHCHECKS_URL }}
    steps:
      - name: Report start to healthchecks.io
        if: env.HEALTHCHECKS_URL != ''
        run: curl -fsS -m 10 --retry 3 "$HEALTHCHECKS_URL/start" > /dev/null || true

      - uses: actions/checkout@v4
        with:
          path: data

      - uses: actions/checkout@v4
        with:
          repository: Gesetze-fuer-KI/gesetze-fuer-ki
          path: tool

      - uses: astral-sh/setup-uv@v6

      - name: Sync
        working-directory: tool/app
        run: uv run --frozen --no-dev python sync.py --out "$GITHUB_WORKSPACE/data"

      - name: Commit
        working-directory: data
        run: |
          git config user.name "gesetze-fuer-ki sync"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet -- . ':!.sync'; then
            echo "No law changed."
            exit 0
          fi
          git commit -q -F .sync/commit-message.txt
          git push

      - name: Report to Uptime Kuma
        if: success() && env.KUMA_PUSH_URL != ''
        run: curl -fsS -m 10 "$KUMA_PUSH_URL" > /dev/null

      - name: Report result to healthchecks.io
        if: always() && env.HEALTHCHECKS_URL != ''
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$JOB_STATUS" = success ]; then path=""; else path="/fail"; fi
          curl -fsS -m 10 --retry 3 "$HEALTHCHECKS_URL$path" > /dev/null || true
